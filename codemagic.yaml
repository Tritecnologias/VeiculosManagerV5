workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "CotaZero KM - Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.cotazerokm.app
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Force Node 22
        script: |
          nvm install 22
          nvm use 22
          echo "export PATH=$(dirname $(nvm which 22)):$PATH" >> $CM_ENV
          node -v
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Compilando usando Workspace..."
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "$XCODE_SCHEME"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "Compilando usando Project..."
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "$XCODE_SCHEME"
          else
            echo "Estrutura iOS não encontrada em ios/App:"
            ls -la ios/App
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
