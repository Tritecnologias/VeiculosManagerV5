workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "CotaZero KM - Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.cotazerokm.app
      node: 22
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Force Node 22
        script: |
          nvm install 22
          nvm use 22
          echo "export PATH=$(dirname $(nvm which 22)):$PATH" >> $CM_ENV
          node -v
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Prepare and Sync Capacitor iOS
        script: |
          # Se a pasta ios nao existir no repositorio, adiciona a plataforma
          if [ ! -d "ios" ]; then
            echo "Pasta ios nao encontrada. A inicializar plataforma iOS..."
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          # Procura a pasta que contem o Podfile
          PODFILE_DIR=$(find . -name "Podfile" -not -path "*/Pods/*" -exec dirname {} \; | head -n 1)
          if [ -n "$PODFILE_DIR" ]; then
            echo "Podfile encontrado em: $PODFILE_DIR"
            cd "$PODFILE_DIR"
            pod install --repo-update
          else
            echo "Nenhum Podfile encontrado no projeto."
            ls -la
            exit 1
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" 2>/dev/null | head -n 1)
          PROJECT_PATH=$(find ios -name "*.xcodeproj" 2>/dev/null | head -n 1)
          if [ -n "$WORKSPACE_PATH" ]; then
            echo "A compilar via Workspace: $WORKSPACE_PATH"
            xcode-project build-ipa \
              --workspace "$WORKSPACE_PATH" \
              --scheme "$XCODE_SCHEME"
          elif [ -n "$PROJECT_PATH" ]; then
            echo "A compilar via Project: $PROJECT_PATH"
            xcode-project build-ipa \
              --project "$PROJECT_PATH" \
              --scheme "$XCODE_SCHEME"
          else
            echo "Nenhum projeto Xcode encontrado em ios/:"
            find ios -maxdepth 3
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
